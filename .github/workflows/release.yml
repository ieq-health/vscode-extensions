name: Release

# Push a tag named <package>-v<version>, e.g. linq-v0.5.15, to publish that
# package to the Marketplace. scripts/build.mjs checks that the version matches
# the package's package.json.
on:
  push:
    tags:
      - '*-v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node scripts/build.mjs release "$GITHUB_REF_NAME"
        env:
          VSCE_PAT: ${{ secrets.PUBLISHER_TOKEN }}
