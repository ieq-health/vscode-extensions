name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # yamlfmt is not on npm; pinned to the version used in the editor
      - name: Install yamlfmt
        env:
          VERSION: 0.21.0
          SHA256: 1f300d9257b232bb3b541d7fb1b0e6b3c121bcbab381c86cd38cb8722be8a566
        working-directory: ${{ runner.temp }}
        run: |
          archive="yamlfmt_${VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/google/yamlfmt/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" yamlfmt
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - run: npm run lint

      - run: npm test

      # Validates manifests, type-checks, bundles and packages every extension
      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
