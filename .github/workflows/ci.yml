name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Validates manifests, type-checks, bundles and packages every extension
      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
